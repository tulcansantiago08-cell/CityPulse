# Corre los tests unitarios en cada push a main y en cada pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Misma versión que pide gradle/gradle-daemon-jvm.properties, para no descargarla otra vez.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Los runners ubuntu-latest ya traen el SDK de Android (ANDROID_HOME) con las licencias
      # aceptadas; Gradle descarga solo la plataforma que falte (android-37).

      - uses: gradle/actions/setup-gradle@v4

      # El plugin de Google Services necesita el archivo para compilar. Los tests no se conectan
      # a Firebase, así que basta con uno de prueba (el real no se sube al repositorio).
      - name: Crear google-services.json de prueba
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "citypulse-ci",
              "storage_bucket": "citypulse-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.citypulse" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-dummy-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Guardar el informe si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-tests
          path: app/build/reports/tests/
